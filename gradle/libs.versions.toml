[versions]
jvm = "17"
kotlin = "2.4.10"
mockk = "1.14.11"
slf4j = "2.0.18"
logback = "1.5.34"
ofdKtProto = "2.0.3-2"
# Та же сборка CPCR 2.0.4, что у кодека: тестовый БФД разбирает ею запросы кассы на 2.0.4.
ofdKtProtoV204 = "2.0.4-1"
detekt = "1.23.8"
ofdProtoCodec = "1.3.0"
ofdNetworkClient = "1.2.1"
serialization = "1.11.0"
coroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
validation = "3.1.1"
swagger = "2.2.52"
archunit = "1.4.2"
junit = "6.1.3"
androidGradlePlugin = "9.2.1"
androidCompileSdk = "37"
androidMinSdk = "23"
kover = "0.9.9"
nmcp = "1.6.1"
room = "2.7.0"
sqlite = "2.5.0"
ksp = "2.3.10"
openhtmltopdf = "1.1.40"
pdfbox = "3.0.3"
jsoup = "1.18.3"
zxing = "3.5.4"
ktor = "3.5.2"
angusMail = "2.0.5"
greenmail = "2.1.14"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
# Logging
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Room & SQLite KMP
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Документы без браузера на JVM
openhtmltopdf-pdfbox = { group = "io.github.openhtmltopdf", name = "openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Каналы доставки чека: HTTP-провайдеры и почта
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
angus-mail = { group = "org.eclipse.angus", name = "jakarta.mail", version.ref = "angusMail" }
greenmail = { group = "com.icegreen", name = "greenmail", version.ref = "greenmail" }

# Kotlin
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Resilience4j

# Validation & Swagger (lightweight APIs for core)
jakarta-validation = { group = "jakarta.validation", name = "jakarta.validation-api", version.ref = "validation" }
swagger-annotations = { group = "io.swagger.core.v3", name = "swagger-annotations-jakarta", version.ref = "swagger" }

# Testing
# Проверки на устройстве: Android-адаптеры, которые без настоящей ОС не проверить (WebView).
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
ofd-kt-proto = { group = "io.github.texport", name = "ofd-kt-proto", version.ref = "ofdKtProto" }
ofd-kt-proto-v204 = { group = "io.github.texport", name = "ofd-kt-proto-v204", version.ref = "ofdKtProtoV204" }
ofd-proto-codec = { group = "io.github.texport", name = "ofd-proto-codec", version.ref = "ofdProtoCodec" }
ofd-network-client = { group = "io.github.texport", name = "ofd-network-client", version.ref = "ofdNetworkClient" }
archunit = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
