# Выпуск ядра на GitHub.
#
# Сам: после зелёного CI на main каждый ещё не выпущенный коммит выпускается
# под следующим номером своей линии (val versionLine в build.gradle.kts):
# v1.5.0, v1.5.1, … Метку ставит сам выпуск. У ядра это ВЫКЛЮЧЕНО, пока
# в репозитории не заведена переменная AUTO_RELEASE=true (Settings → Secrets
# and variables → Actions → Variables).
#
# Руками: метка v<линия>.<номер> выпускает помеченный коммит.
#
# Порядок: файлы → выпуск на GitHub. Упали файлы — выпуск не создаётся.
#
# Файлы выпуска: jar для JVM (в него собраны все модули ядра, как его берёт
# узел), SuperkassaCore.xcframework.zip для iOS (строка binaryTarget с его
# суммой — в заметках) и superkassa-core-maven-<версия>.zip — собранное ядро
# в раскладке хранилища Maven. Ядро больше нигде не публикуется: Android
# и любой другой потребитель берут его из этого zip. В нём каждый модуль
# со всеми целями (JVM, Android, iOS) и метаданными модулей Gradle, а рядом
# ровно те сборки протокола и кодека, с которыми собрано ядро.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_run:
    workflows: [ 'CI Build' ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE || 'false' }}
          LINE_FILE: build.gradle.kts
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          bash .github/scripts/release-plan.sh

  # По ручной метке проверка ещё не шла; после CI на main она уже зелёная.
  checks:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: [ plan, checks ]
    if: >-
      !cancelled() && needs.plan.outputs.release == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - uses: ./.github/actions/siblings

      # generateSpmManifest собирает XCFramework, упаковывает его в zip
      # и считает сумму; Package.swift, который она переписывает, остаётся
      # на раннере.
      - name: Собрать jar и XCFramework
        run: ./gradlew jvmJar generateSpmManifest -PreleaseVersion="$VERSION"

      - name: Сложить файлы выпуска
        run: |
          mkdir -p dist
          cp "build/libs/superkassa-core-jvm-$VERSION.jar" dist/
          zip=build/XCFrameworks/release/SuperkassaCore.xcframework.zip
          cp "$zip" dist/
          shasum -a 256 "$zip" | cut -d' ' -f1 > dist/SuperkassaCore.xcframework.zip.sha256
          ls -l dist

      # Ядро ложится в локальное хранилище раннера, где шаг соседей уже
      # оставил протокол и кодек; упаковывается вся группа io.github.texport.
      # Протокол и кодек собраны из веток соседей и больше нигде не лежат:
      # без них в zip потребителю пришлось бы собирать их самому.
      - name: Собранное ядро для Gradle
        run: |
          ./gradlew publishToMavenLocal -PreleaseVersion="$VERSION"
          (cd ~/.m2/repository && zip -qr "$GITHUB_WORKSPACE/dist/superkassa-core-maven-$VERSION.zip" io/github/texport)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [ plan, artifacts ]
    if: ${{ !cancelled() && needs.artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # Вся история с метками — для заметок о выпуске.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Заметки о выпуске
        run: |
          bash .github/scripts/release-notes.sh
          sum=$(cat dist/SuperkassaCore.xcframework.zip.sha256)
          cat >> notes.md <<NOTES

          ## Swift Package Manager

          \`\`\`swift
          .binaryTarget(
              name: "SuperkassaCore",
              url: "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SuperkassaCore.xcframework.zip",
              checksum: "${sum}"
          )
          \`\`\`
          NOTES
          cat notes.md

      # Выпуск мог быть заведён руками — тогда файлы докладываются в него
      # поверх прежних, а заметки остаются те, что написаны руками. Иначе
      # выпуск создаётся вместе с меткой на выпускаемом коммите.
      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "superkassa-core $TAG" --notes-file notes.md dist/*
          fi
          echo "- Выпуск на GitHub: $TAG" >> "$GITHUB_STEP_SUMMARY"
