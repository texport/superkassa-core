# Соседние библиотеки texport, которых нет в Maven Central в нужной версии.
#
# Ядро берёт кодек 1.3.1, а кодек — протокол 2.0.4 (ofd-kt-proto-v204);
# ни того ни другого в Central ещё нет. Оба собираются из исходников и
# кладутся в локальное хранилище раннера — публиковать ради сборки ничего
# не требуется. Клиент сети (ofd-network-client 1.2.1) в Central есть и
# берётся оттуда.
#
# Ветки или метки соседей задаются здесь и только здесь; их берут и
# проверка, и выпуск.
name: Соседние библиотеки из исходников
description: Собирает ofd-kt-proto и ofd-proto-codec из исходников в локальное хранилище Maven.

inputs:
  ofd-kt-proto-ref:
    description: Ветка или метка texport/ofd-kt-proto
    default: main
  ofd-proto-codec-ref:
    description: Ветка или метка texport/ofd-proto-codec
    default: main

runs:
  using: composite
  steps:
    - name: Протокол
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-kt-proto
        ref: ${{ inputs.ofd-kt-proto-ref }}
        path: .siblings/ofd-kt-proto

    - name: Кодек протокола
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-proto-codec
        ref: ${{ inputs.ofd-proto-codec-ref }}
        path: .siblings/ofd-proto-codec

    - name: Протокол в локальное хранилище
      shell: bash
      working-directory: .siblings/ofd-kt-proto
      run: ./gradlew publishToMavenLocal

    - name: Кодек в локальное хранилище
      shell: bash
      working-directory: .siblings/ofd-proto-codec
      run: ./gradlew publishToMavenLocal
