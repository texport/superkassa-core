# Соседние библиотеки texport, которых нет в Maven Central в нужной версии.
#
# Ядро берёт кодек той версии, что в gradle/libs.versions.toml (ofdProtoCodec),
# а кодек — протокол 2.0.4 той версии, что в его libs.versions.toml
# (ofdKtProtoV204). Оба собираются из исходников веток ниже и кладутся в
# локальное хранилище раннера под этими версиями — публиковать ради сборки
# ничего не требуется. Клиент сети (ofd-network-client) в Central есть и
# берётся оттуда.
#
# Ветки соседей задаются здесь и только здесь; их берут и проверка, и выпуск.
name: Соседние библиотеки из исходников
description: Собирает ofd-kt-proto и ofd-proto-codec из исходников в локальное хранилище Maven.

inputs:
  ofd-kt-proto-ref:
    description: Ветка или метка texport/ofd-kt-proto
    default: main
  ofd-proto-codec-ref:
    description: Ветка или метка texport/ofd-proto-codec
    default: main

runs:
  using: composite
  steps:
    - name: Протокол
      uses: actions/checkout@v7
      with:
        repository: texport/ofd-kt-proto
        ref: ${{ inputs.ofd-kt-proto-ref }}
        path: .siblings/ofd-kt-proto

    - name: Кодек протокола
      uses: actions/checkout@v7
      with:
        repository: texport/ofd-proto-codec
        ref: ${{ inputs.ofd-proto-codec-ref }}
        path: .siblings/ofd-proto-codec

    - name: Протокол и кодек в локальное хранилище
      shell: bash
      run: |
        codec=$(sed -n 's/^ofdProtoCodec = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        proto=$(sed -n 's/^ofdKtProtoV204 = "\(.*\)"$/\1/p' .siblings/ofd-proto-codec/gradle/libs.versions.toml)
        test -n "$codec" && test -n "$proto" || { echo "::error::Нет версии кодека или протокола в libs.versions.toml"; exit 1; }
        (cd .siblings/ofd-kt-proto && ./gradlew publishToMavenLocal -PreleaseVersion="$proto")
        (cd .siblings/ofd-proto-codec && ./gradlew publishToMavenLocal -PreleaseVersion="$codec")
